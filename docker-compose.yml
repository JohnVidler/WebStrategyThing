services:
  server:
    build:
      context: .
      target: server
    environment:
      FOG: ${FOG:-on}
      PORT: "8080"
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/v1/rooms').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  client:
    build:
      context: .
      target: client
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${CLIENT_PORT:-8081}:80"
    restart: unless-stopped