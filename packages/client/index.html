<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Digital Chaos (Alpha)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Electrolize&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="lobby" hidden></div>
    <div id="connecting" hidden></div>
    <aside id="panel">
      <header>
        <div class="row-spread">
          <h1>Digital Chaos</h1>
          <span>
            <button id="designer-open" data-sound="menu.click" title="Design classes and edit programs (F2)">Designer</button>
            <button id="docs-open" data-sound="menu.click" title="Manual and API documentation (F1)">Docs</button>
            <a class="button" href="docs.html" target="_blank" rel="noopener" title="Open the docs in a new tab">↗</a>
          </span>
        </div>
        <div class="sidebar-meta">
          <span id="status">connecting…</span>
          <div id="environment" class="env-tiles"></div>
        </div>
      </header>

      <section>
        <h2>Resources</h2>
        <div id="resource-bars" aria-label="Resources" hidden></div>
      </section>

      <section>
        <h2>Actions</h2>
        <div id="groups" class="group-bar" aria-label="Control groups" hidden></div>
        <div id="actions" class="action-grid" role="toolbar" aria-label="Actions for the selected units"></div>
        <div id="action-hint" class="muted"></div>
      </section>

      <section>
        <h2>Selection</h2>
        <div id="selection-resources" class="resource-list" hidden></div>
        <div id="production" hidden>
          <div id="production-status" class="muted"></div>
          <div id="production-queue" class="queue-grid" aria-label="Production queue"></div>
          <div id="production-buttons" class="action-grid"></div>
        </div>
        <div id="modules" hidden></div>
        <div id="result"></div>
      </section>

      <footer id="designs-bar" aria-label="Your designs">
        <div class="row">
          <button id="designs-download" data-sound="ui.design_download" title="Save your unit and building designs and their scripts as a JSON file">⬇ Download designs</button>
          <button id="designs-upload" title="Load designs from a JSON file (asks first)">⬆ Upload designs</button>
        </div>
        <button id="designs-reset" class="link" title="Put every default class back and retire your own (asks first)">Reset designs to defaults…</button>
        <input id="designs-file" type="file" accept=".json,application/json" hidden>
        <button id="resign" data-sound="none" title="Give up this match (press twice); you can then spectate or go back to the room list">Resign</button>
      </footer>
    </aside>
    <main id="stage">
      <div id="map">
        <div id="hoverbar" hidden></div>
        <table id="scoreboard" aria-label="Players" hidden></table>
        <div id="standings" hidden></div>
        <div id="pause" hidden></div>
        <div id="waiting" hidden></div>
        <div id="defeat" hidden></div>
        <div id="spectating" hidden>Spectating — the whole map is visible</div>
        <div id="docs-overlay" hidden>
          <div class="docs-bar">
            <span>Manual &amp; API docs — the game keeps running underneath</span>
            <span>
              <span class="docs-music"></span>
              <button id="docs-back" data-sound="menu.back" title="Back to the previous manual page">← Back</button>
              <a class="button" href="docs.html" target="_blank" rel="noopener">Open in new tab ↗</a>
              <button id="docs-close" data-sound="ui.panel_close" title="Close (Esc)">✕</button>
            </span>
          </div>
          <iframe id="docs-frame" title="Script API documentation"></iframe>
        </div>
      </div>
      <nav id="buildbar" aria-label="Place a building"></nav>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
